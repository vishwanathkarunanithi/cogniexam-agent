<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniExam | Academic Question Paper Bloom's Auditor & Model Answer Key Synthesizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0A0E1A; color: #F1F5F9; }
        .formal-panel { background: #111827; border: 1px solid #1F2937; }
        .formal-card { background: #0F172A; border: 1px solid #1E293B; }
        .formal-header { background: #0F172A; border: 1px solid #1E3A8A; border-top: 4px solid #2563EB; }
        .dropzone-box { border: 2px dashed #3B82F6; background: rgba(37, 99, 235, 0.05); transition: all 0.2s ease; }
        .dropzone-box:hover { border-color: #60A5FA; background: rgba(37, 99, 235, 0.1); }
        .badge-l1 { background: rgba(59, 130, 246, 0.12); color: #93C5FD; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-l2 { background: rgba(16, 185, 129, 0.12); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-l3 { background: rgba(234, 179, 8, 0.12); color: #FDE047; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-l4 { background: rgba(249, 115, 22, 0.12); color: #FDBA74; border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge-l5 { background: rgba(236, 72, 153, 0.12); color: #F9A8D4; border: 1px solid rgba(236, 72, 153, 0.3); }
        .badge-l6 { background: rgba(168, 85, 247, 0.12); color: #D8B4FE; border: 1px solid rgba(168, 85, 247, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('audit');
            
            // Sample papers list
            const [sampleList, setSampleList] = useState([]);
            const [selectedSampleKey, setSelectedSampleKey] = useState('anna_univ_cloud');

            // Question paper state
            const [paperText, setPaperText] = useState('');
            const [courseTitle, setCourseTitle] = useState('CS8791 - Cloud Computing and Distributed Systems');
            const [uploadedFileName, setUploadedFileName] = useState('');
            const [loading, setLoading] = useState(false);
            const [downloadingPdf, setDownloadingPdf] = useState(false);
            const [result, setResult] = useState(null);
            const [savedCloudNotice, setSavedCloudNotice] = useState(false);

            // Cloud Vault Tab state
            const [cloudPapers, setCloudPapers] = useState([]);
            const [loadingVault, setLoadingVault] = useState(false);

            // Student assessment state
            const [evalLoading, setEvalLoading] = useState(false);
            const [evalResult, setEvalResult] = useState(null);
            const [stdAnswer, setStdAnswer] = useState("Chubby is Google's lock service based on Paxos algorithm for coarse-grained locks like master election. ZooKeeper uses ZAB with in-memory trees for high-throughput fine-grained updates.");

            // File input ref
            const fileInputRef = useRef(null);

            // Chart ref
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                fetchSamplePapers();
                fetchCloudVault();
            }, []);

            const fetchSamplePapers = async () => {
                try {
                    const res = await fetch('/api/sample-papers');
                    const data = await res.json();
                    setSampleList(data);
                    if (data.length > 0) {
                        loadSpecificSample(data[0].key);
                    }
                } catch (e) {
                    console.error("Error fetching samples:", e);
                }
            };

            const loadSpecificSample = async (key) => {
                try {
                    const res = await fetch(`/api/sample-papers/${key}`);
                    const data = await res.json();
                    setSelectedSampleKey(key);
                    setPaperText(data.paper_text);
                    setCourseTitle(data.course_title);
                    setUploadedFileName(`${data.metadata.institution} (${data.metadata.course_code})`);
                    setResult(null);
                } catch (e) {
                    console.error("Error loading sample:", e);
                }
            };

            const fetchCloudVault = async () => {
                setLoadingVault(true);
                try {
                    const res = await fetch('/api/cloud-papers');
                    const data = await res.json();
                    setCloudPapers(data);
                } catch (e) {
                    console.log("Vault fetch error:", e);
                } finally {
                    setLoadingVault(false);
                }
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setUploadedFileName(file.name);
                
                if (file.name.endsWith('.pdf')) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('course_title', courseTitle);

                    setLoading(true);
                    try {
                        const res = await fetch('/api/upload-paper', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        setResult(data);
                        setSavedCloudNotice(true);
                        fetchCloudVault();
                    } catch (err) {
                        alert("Error parsing uploaded PDF: " + err.message);
                    } finally {
                        setLoading(false);
                    }
                } else {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPaperText(event.target.result);
                    };
                    reader.readAsText(file);
                }
            };

            const handleAnalyze = async () => {
                if (!paperText.trim()) return;
                setLoading(true);
                setSavedCloudNotice(false);
                try {
                    const res = await fetch('/api/analyze-paper', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paper_text: paperText, course_title: courseTitle })
                    });
                    const data = await res.json();
                    setResult(data);
                    setSavedCloudNotice(true);
                    fetchCloudVault();
                } catch (err) {
                    alert("Analysis error: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const loadPaperFromVault = async (paperId) => {
                try {
                    const res = await fetch(`/api/cloud-papers/${paperId}`);
                    const data = await res.json();
                    setCourseTitle(data.course_title);
                    setPaperText(data.paper_text);
                    setResult(data.analysis_result);
                    setActiveTab('audit');
                } catch (e) {
                    alert("Error loading paper from cloud vault: " + e.message);
                }
            };

            const downloadPdf = async () => {
                if (!result) return;
                setDownloadingPdf(true);
                try {
                    const res = await fetch('/api/download-answer-key-pdf', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(result)
                    });
                    if (!res.ok) throw new Error("Failed to generate academic PDF");
                    
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Official_Model_Answer_Key_${result.course_title.replace(/\s+/g, '_')}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } catch (e) {
                    alert("PDF Generation error: " + e.message);
                } finally {
                    setDownloadingPdf(false);
                }
            };

            useEffect(() => {
                if (result && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    const dist = result.metrics.distribution;
                    const labels = Object.keys(dist).map(k => `${k} (${dist[k].name})`);
                    const values = Object.keys(dist).map(k => dist[k].marks);

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Marks Allocated',
                                data: values,
                                backgroundColor: [
                                    'rgba(59, 130, 246, 0.85)',
                                    'rgba(16, 185, 129, 0.85)',
                                    'rgba(234, 179, 8, 0.85)',
                                    'rgba(249, 115, 22, 0.85)',
                                    'rgba(236, 72, 153, 0.85)',
                                    'rgba(168, 85, 247, 0.85)'
                                ],
                                borderColor: '#1E293B',
                                borderWidth: 1,
                                borderRadius: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                    ticks: { color: '#94A3B8', font: { family: 'Inter', size: 10 } }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: '#94A3B8', font: { family: 'Inter', size: 10 } }
                                }
                            }
                        }
                    });
                }
            }, [result]);

            const downloadMarkdownReport = () => {
                if (!result) return;
                let md = `# ${result.institution_header || result.exam_title}\n\n`;
                md += `Course Title: ${result.course_title}\n`;
                md += `Total Marks: ${result.total_marks}\n`;
                md += `Bloom Cognitive Depth Index: ${result.bloom_index} / 6.0\n`;
                md += `OBE Accreditation Verdict: ${result.verdict}\n\n---\n\n`;
                md += `> EVALUATOR GUIDANCE (STUDENT OWN-WORDS EVALUATION):\n> ${result.disclaimer}\n\n---\n\n`;
                
                result.questions.forEach(q => {
                    md += `### Question ${q.q_no} [${q.marks} Marks] - ${q.section || 'PART A'}\n`;
                    md += `Question: ${q.question}\n`;
                    md += `Bloom Level: ${q.bloom_level} - ${q.bloom_name} | Action Verb: ${q.action_verb}\n`;
                    md += `Pedagogical Justification: ${q.justification}\n\n`;
                    md += `#### Canonical Model Answer:\n${q.model_answer}\n\n`;
                    md += `#### Step-by-Step Marking Scheme:\n`;
                    q.rubric.forEach(r => {
                        md += `- ${r.criterion}: **${r.marks} Marks**\n`;
                    });
                    if (q.own_words_criteria && q.own_words_criteria.length > 0) {
                        md += `\n#### Key Semantic Criteria for Student's Own Words (Full/Partial Credit Guide):\n`;
                        q.own_words_criteria.forEach(c => {
                            md += `- ${c}\n`;
                        });
                    }
                    md += `\n---\n\n`;
                });

                const blob = new Blob([md], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Official_Model_Answer_Key_${result.course_title.replace(/\s+/g, '_')}.md`;
                a.click();
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Formal Top Navigation Header */}
                    <header className="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
                            <div className="flex items-center space-x-4">
                                <div className="w-9 h-9 rounded-md bg-blue-700 flex items-center justify-center font-bold text-white text-xs tracking-wider">
                                    AI
                                </div>
                                <div>
                                    <h1 className="text-sm font-bold tracking-tight text-white flex items-center gap-2">
                                        CogniExam Enterprise Platform
                                        <span className="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800 font-semibold">Production Ready</span>
                                    </h1>
                                    <p className="text-[11px] text-slate-400">Dynamic Multi-Institutional Bloom's Taxonomy Auditor & Model Answer Key Synthesizer</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3 text-xs">
                                <span className="px-3 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300 font-medium flex items-center gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                    Google Gemini Cloud AI
                                </span>
                                <span className="px-3 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300 font-medium flex items-center gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                                    Cloud Vault Active
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="border-b border-slate-800 bg-slate-900">
                        <div className="max-w-7xl mx-auto px-6 flex space-x-8">
                            <button
                                onClick={() => setActiveTab('audit')}
                                className={`py-3.5 text-xs font-semibold tracking-wide uppercase border-b-2 transition-all ${activeTab === 'audit' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                Question Paper Evaluation & Model Answer Key
                            </button>
                            <button
                                onClick={() => { setActiveTab('vault'); fetchCloudVault(); }}
                                className={`py-3.5 text-xs font-semibold tracking-wide uppercase border-b-2 transition-all flex items-center gap-2 ${activeTab === 'vault' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                Institutional Cloud Vault & Archive
                                {cloudPapers.length > 0 && (
                                    <span className="text-[10px] px-1.5 py-0.2 rounded bg-blue-600 text-white font-mono">{cloudPapers.length}</span>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl mx-auto px-6 py-6 w-full">
                        {activeTab === 'audit' && (
                            <div className="space-y-6">
                                {savedCloudNotice && (
                                    <div className="bg-emerald-950/30 border border-emerald-500/40 rounded-lg p-3 text-xs text-emerald-300 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <span className="font-bold uppercase tracking-wider text-[11px] text-emerald-400">[Cloud Archival Confirmed]</span>
                                            <span>This examination question paper and certified answer key have been archived to your Institutional Cloud Repository.</span>
                                        </div>
                                        <button onClick={() => setActiveTab('vault')} className="underline font-semibold hover:text-white">View in Repository &rarr;</button>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    {/* Left Input Column */}
                                    <div className="lg:col-span-5 formal-panel rounded-lg p-5 space-y-4">
                                        {/* 10 Diverse Real University Question Papers Selector */}
                                        <div>
                                            <div className="flex items-center justify-between mb-1.5">
                                                <label className="text-xs font-bold text-slate-200 uppercase tracking-wider">
                                                    Select Real University Examination Paper (10 Samples)
                                                </label>
                                                <span className="text-[10px] text-blue-400 font-semibold">Diverse Institutions</span>
                                            </div>
                                            <select
                                                value={selectedSampleKey}
                                                onChange={(e) => loadSpecificSample(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 font-medium"
                                            >
                                                {sampleList.map((item) => (
                                                    <option key={item.key} value={item.key}>
                                                        {item.id}. {item.institution} &bull; {item.course_code} - {item.course_title}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Drag & Drop File Upload Box */}
                                        <div
                                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                            className="dropzone-box rounded-lg p-4 text-center cursor-pointer space-y-1"
                                        >
                                            <input
                                                type="file"
                                                ref={fileInputRef}
                                                onChange={handleFileUpload}
                                                accept=".pdf,.txt,.doc,.docx"
                                                className="hidden"
                                            />
                                            <p className="text-xs font-bold text-blue-400 uppercase tracking-wider">
                                                Upload External Question Paper File
                                            </p>
                                            <p className="text-[11px] text-slate-400">
                                                Supports Adobe PDF, Microsoft Word (.docx), or Plain Text
                                            </p>
                                            {uploadedFileName && (
                                                <div className="inline-block px-2.5 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800 text-[10.5px] font-mono mt-1">
                                                    Loaded: {uploadedFileName}
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Course Identification</label>
                                            <input
                                                type="text"
                                                value={courseTitle}
                                                onChange={(e) => setCourseTitle(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Question Paper Transcript</label>
                                            <textarea
                                                rows="10"
                                                value={paperText}
                                                onChange={(e) => setPaperText(e.target.value)}
                                                placeholder="Paste or upload question paper text..."
                                                className="w-full bg-slate-900 border border-slate-700 rounded-md p-3 text-xs font-mono text-slate-300 focus:outline-none focus:border-blue-500 resize-none leading-relaxed"
                                            ></textarea>
                                        </div>

                                        <button
                                            onClick={handleAnalyze}
                                            disabled={loading}
                                            className="w-full py-3 bg-blue-700 hover:bg-blue-600 text-white rounded-md font-bold text-xs uppercase tracking-wider transition disabled:opacity-50 flex items-center justify-center gap-2"
                                        >
                                            {loading ? (
                                                <span>Auditing Bloom Cognitive Levels & Synthesizing Answer Keys...</span>
                                            ) : (
                                                <span>Audit Bloom Score & Generate Model Answer Key</span>
                                            )}
                                        </button>
                                    </div>

                                    {/* Right Output Column */}
                                    <div className="lg:col-span-7 space-y-6">
                                        {!result && (
                                            <div className="formal-panel rounded-lg p-12 text-center flex flex-col items-center justify-center h-full min-h-[480px]">
                                                <h3 className="text-base font-bold text-white uppercase tracking-wider mb-2">Automated Examination Audit & Model Answer Synthesis</h3>
                                                <p className="text-xs text-slate-400 max-w-md leading-relaxed">
                                                    Select an examination paper on the left or upload any paper PDF, then click <strong>"Audit Bloom Score & Generate Model Answer Key"</strong>.
                                                </p>
                                                <div className="mt-5 text-xs text-slate-300 space-y-1.5 text-left bg-slate-950 p-4 rounded-md border border-slate-800 w-full max-w-md">
                                                    <p className="font-semibold text-blue-400 uppercase tracking-wider text-[11px]">System Capabilities:</p>
                                                    <p>&bull; Dynamic Institution Extraction: Reads whatever university or board is on the question paper and adapts the official title.</p>
                                                    <p>&bull; Objective Cognitive Depth Index: Evaluates Bloom's Revised Taxonomy levels (L1 to L6).</p>
                                                    <p>&bull; Evaluator Ethics Guidance: Outlines explicit criteria for student own-words credit allocation.</p>
                                                    <p>&bull; Step-by-Step Marking Rubrics: Complete step breakdowns with individual marks.</p>
                                                    <p>&bull; Formal PDF Download: Export official publication-ready evaluation documentation.</p>
                                                </div>
                                            </div>
                                        )}

                                        {result && (
                                            <div className="space-y-6">
                                                {/* Formal Institutional Header (Clean, Dynamic, No Stray Pipes) */}
                                                <div className="formal-header rounded-lg p-6 text-center shadow-lg">
                                                    <h2 className="text-sm font-extrabold text-blue-400 uppercase tracking-widest">{result.institution_name}</h2>
                                                    <p className="text-xs text-slate-300 font-semibold mt-1">{result.department}</p>
                                                    <div className="inline-block px-4 py-1 rounded bg-blue-950 border border-blue-600 text-white font-bold text-xs uppercase tracking-wider mt-3">
                                                        OFFICIAL MODEL ANSWER KEY & BLOOM'S TAXONOMY EVALUATION SCHEME
                                                    </div>
                                                    
                                                    {/* Clean Metadata Table */}
                                                    <div className="mt-4 pt-3 border-t border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                                                        <div className="bg-slate-950/80 p-2 rounded border border-slate-800/60">
                                                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Course</span>
                                                            <span className="text-slate-200 font-medium font-mono text-[11px] truncate block">{result.course_title}</span>
                                                        </div>
                                                        <div className="bg-slate-950/80 p-2 rounded border border-slate-800/60">
                                                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Total Marks</span>
                                                            <span className="text-white font-bold text-sm">{result.total_marks} Marks</span>
                                                        </div>
                                                        <div className="bg-slate-950/80 p-2 rounded border border-slate-800/60">
                                                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Bloom Cognitive Depth</span>
                                                            <span className="text-emerald-400 font-bold text-sm">{result.bloom_index} <span className="text-[10px] font-normal text-slate-400">/ 6.0</span></span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Formal Evaluator & Student Own Words Disclaimer */}
                                                <div className="bg-amber-950/20 border-l-4 border-amber-600 rounded-r-md p-4 text-xs text-amber-200/90 space-y-1">
                                                    <p className="font-bold text-amber-400 uppercase tracking-wider text-[11px]">
                                                        OFFICIAL EVALUATION GUIDANCE & STUDENT OWN-WORDS ASSESSMENT CRITERIA:
                                                    </p>
                                                    <p className="leading-relaxed text-[11.5px]">
                                                        Students are encouraged to express technical explanations, derivations, and solutions in their own words. Evaluators <strong>MUST award full or proportional marks</strong> whenever the core conceptual logic, required technical keywords, and essential principles are satisfied, even if phrasing differs from the canonical solution. Refer to the <em>"Key Semantic Criteria for Student Own Words"</em> outlined under each question below.
                                                    </p>
                                                </div>

                                                {/* Metric Summary Cards */}
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                    <div className="formal-panel rounded-lg p-3.5">
                                                        <p className="text-[11px] text-slate-400 uppercase font-semibold">Total Marks</p>
                                                        <p className="text-xl font-bold text-white mt-1">{result.total_marks}</p>
                                                        <p className="text-[10.5px] text-blue-400 mt-0.5">{result.total_questions} Questions</p>
                                                    </div>
                                                    <div className="formal-panel rounded-lg p-3.5">
                                                        <p className="text-[11px] text-slate-400 uppercase font-semibold">Bloom Index</p>
                                                        <p className="text-xl font-bold text-emerald-400 mt-1">{result.bloom_index} <span className="text-xs text-slate-400 font-normal">/ 6.0</span></p>
                                                        <p className="text-[10.5px] text-slate-400 mt-0.5">Cognitive Depth</p>
                                                    </div>
                                                    <div className="formal-panel rounded-lg p-3.5">
                                                        <p className="text-[11px] text-slate-400 uppercase font-semibold">HOTS Ratio</p>
                                                        <p className="text-xl font-bold text-purple-400 mt-1">{result.metrics.high_order_pct}%</p>
                                                        <p className="text-[10.5px] text-slate-400 mt-0.5">L5-L6 Thinking</p>
                                                    </div>
                                                    <div className="formal-panel rounded-lg p-3.5">
                                                        <p className="text-[11px] text-slate-400 uppercase font-semibold">OBE Status</p>
                                                        <p className="text-xs font-bold text-amber-400 mt-2 truncate">Certified</p>
                                                        <p className="text-[10.5px] text-slate-400 mt-0.5">NBA/ABET Audit</p>
                                                    </div>
                                                </div>

                                                {/* Cognitive Distribution Chart & Download Bar */}
                                                <div className="formal-panel rounded-lg p-5">
                                                    <div className="flex items-center justify-between mb-4">
                                                        <h3 className="text-xs font-bold text-slate-200 uppercase tracking-wider">
                                                            Cognitive Distribution across Bloom's Levels
                                                        </h3>
                                                        <div className="flex items-center space-x-2">
                                                            <button
                                                                onClick={downloadPdf}
                                                                disabled={downloadingPdf}
                                                                className="px-3.5 py-1.5 rounded bg-blue-700 hover:bg-blue-600 text-white font-semibold text-xs tracking-wide uppercase transition disabled:opacity-50"
                                                            >
                                                                {downloadingPdf ? 'Generating PDF...' : 'Download Answer Key (PDF)'}
                                                            </button>
                                                            <button
                                                                onClick={downloadMarkdownReport}
                                                                className="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs tracking-wide uppercase transition border border-slate-700"
                                                            >
                                                                Export Markdown (.MD)
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div className="h-44 w-full">
                                                        <canvas ref={chartRef}></canvas>
                                                    </div>
                                                </div>

                                                {/* Formal Model Answers & Marking Schemes */}
                                                <div className="space-y-4">
                                                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">
                                                        Canonical Model Answers and Evaluation Schemes
                                                    </h3>

                                                    {result.questions.map((q, idx) => (
                                                        <div key={idx} className="formal-card rounded-lg p-5 space-y-3.5">
                                                            <div className="flex items-start justify-between">
                                                                <div>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-[11px] font-bold text-blue-400 uppercase tracking-wider">{q.section || 'PART A'}</span>
                                                                        <span className="text-slate-600">&bull;</span>
                                                                        <span className="text-[11px] font-bold text-white uppercase tracking-wider">Question {q.q_no}</span>
                                                                        <span className="text-slate-600">&bull;</span>
                                                                        <span className="text-[11px] font-semibold text-slate-300">{q.marks} Marks</span>
                                                                    </div>
                                                                    <h4 className="text-xs font-semibold text-slate-100 mt-1.5 leading-relaxed">{q.question}</h4>
                                                                </div>
                                                                <span className={`text-[10.5px] px-2.5 py-0.5 rounded font-bold badge-${q.bloom_level.toLowerCase()} shrink-0`}>
                                                                    {q.bloom_level} - {q.bloom_name}
                                                                </span>
                                                            </div>

                                                            <div className="text-[11px] text-slate-400 flex items-center gap-2 bg-slate-950 p-2 rounded border border-slate-800">
                                                                <span><strong>Action Verb:</strong> <code className="text-blue-400 font-mono font-bold">{q.action_verb}</code></span>
                                                                <span className="text-slate-600">&bull;</span>
                                                                <span>{q.justification}</span>
                                                            </div>

                                                            {/* Canonical Model Answer */}
                                                            <div className="bg-slate-950 rounded p-3.5 text-xs space-y-1.5 border border-slate-800">
                                                                <p className="font-bold text-emerald-400 uppercase tracking-wider text-[10.5px]">
                                                                    Canonical Model Answer:
                                                                </p>
                                                                <p className="text-slate-200 leading-relaxed whitespace-pre-line font-mono text-[11px]">{q.model_answer}</p>
                                                            </div>

                                                            {/* Step-by-Step Marking Rubric */}
                                                            <div className="space-y-1">
                                                                <p className="text-[10.5px] font-bold text-slate-300 uppercase tracking-wider">
                                                                    Step-by-Step Marking Scheme:
                                                                </p>
                                                                <div className="grid grid-cols-1 gap-1">
                                                                    {q.rubric.map((r, rIdx) => (
                                                                        <div key={rIdx} className="flex justify-between items-center text-[11px] py-1 px-2.5 rounded bg-slate-900 border border-slate-800">
                                                                            <span className="text-slate-300">{r.criterion}</span>
                                                                            <span className="font-mono font-bold text-blue-400">{r.marks} Marks</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>

                                                            {/* Key Semantic Criteria for Student's Own Words */}
                                                            {q.own_words_criteria && q.own_words_criteria.length > 0 && (
                                                                <div className="bg-blue-950/20 border border-blue-900/40 rounded p-3 space-y-1 text-xs">
                                                                    <p className="font-bold text-blue-300 uppercase tracking-wider text-[10.5px]">
                                                                        Key Semantic Criteria for Student's Own Words (Full/Partial Credit Guide):
                                                                    </p>
                                                                    <ul className="list-disc list-inside space-y-0.5 text-slate-300 text-[11px]">
                                                                        {q.own_words_criteria.map((c, cIdx) => (
                                                                            <li key={cIdx}>{c}</li>
                                                                        ))}
                                                                    </ul>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: CLOUD SAVED PAPERS VAULT */}
                        {activeTab === 'vault' && (
                            <div className="space-y-6">
                                <div className="formal-panel rounded-lg p-5 flex items-center justify-between">
                                    <div>
                                        <h2 className="text-sm font-bold text-white uppercase tracking-wider">
                                            Institutional Examination Vault and Archival Repository
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-0.5">
                                            Centralized Cloud Storage (<code className="text-blue-400 font-mono">gs://cogniexam-paper-vault</code>) containing all certified question papers, Bloom cognitive scorecards, and canonical model answer keys.
                                        </p>
                                    </div>
                                    <button
                                        onClick={fetchCloudVault}
                                        className="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-semibold transition border border-slate-700"
                                    >
                                        Synchronize Repository
                                    </button>
                                </div>

                                {cloudPapers.length === 0 ? (
                                    <div className="formal-panel rounded-lg p-12 text-center text-xs text-slate-400">
                                        No question papers archived in repository. Return to the Evaluation tab and analyze an examination paper to archive it automatically.
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {cloudPapers.map((cp, idx) => (
                                            <div key={idx} className="formal-card rounded-lg p-4 space-y-2.5 border border-slate-800 hover:border-blue-600 transition">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-900">{cp.paper_id}</span>
                                                    <span className="text-xs font-bold text-emerald-400">Bloom: {cp.bloom_index} / 6.0</span>
                                                </div>
                                                <h3 className="text-xs font-bold text-white line-clamp-1">{cp.course_title}</h3>
                                                <div className="text-[11px] text-slate-400 space-y-0.5">
                                                    <p>Total Marks: <strong className="text-slate-200">{cp.total_marks}</strong> ({cp.total_questions} Questions)</p>
                                                    <p>Cloud URI: <code className="text-[10px] text-slate-500 truncate block">{cp.cloud_uri}</code></p>
                                                    <p className="text-[10px] text-slate-500">Archived: {new Date(cp.timestamp).toLocaleString()}</p>
                                                </div>
                                                <button
                                                    onClick={() => loadPaperFromVault(cp.paper_id)}
                                                    className="w-full py-1.5 bg-blue-950 hover:bg-blue-900 text-blue-300 rounded text-xs font-semibold transition border border-blue-800"
                                                >
                                                    Open Examination Paper and Answer Key &rarr;
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-800 py-3 text-center text-[11px] text-slate-500 bg-slate-950">
                        CogniExam Autonomous Multi-Agent Academic System &bull; Outcome-Based Education (OBE) Certified &bull; Powered by Google Cloud AI
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
