<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniExam | Smart Question Paper Bloom's Auditor & Answer Key Synthesizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0B1120; color: #F8FAFC; }
        .glass-panel { background: rgba(23, 32, 54, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .dropzone-box { border: 2px dashed rgba(59, 130, 246, 0.4); background: rgba(30, 58, 138, 0.1); transition: all 0.2s ease; }
        .dropzone-box:hover { border-color: rgba(59, 130, 246, 0.8); background: rgba(30, 58, 138, 0.2); }
        .badge-l1 { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-l2 { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-l3 { background: rgba(234, 179, 8, 0.15); color: #FACC15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-l4 { background: rgba(249, 115, 22, 0.15); color: #FB923C; border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge-l5 { background: rgba(236, 72, 153, 0.15); color: #F472B6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .badge-l6 { background: rgba(168, 85, 247, 0.15); color: #C084FC; border: 1px solid rgba(168, 85, 247, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('audit');
            
            // Question paper state
            const [paperText, setPaperText] = useState('');
            const [courseTitle, setCourseTitle] = useState('CS8401 - Cloud Computing & Distributed Systems');
            const [uploadedFileName, setUploadedFileName] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [savedCloudNotice, setSavedCloudNotice] = useState(false);

            // Cloud Vault Tab state
            const [cloudPapers, setCloudPapers] = useState([]);
            const [loadingVault, setLoadingVault] = useState(false);

            // Student assessment state
            const [evalLoading, setEvalLoading] = useState(false);
            const [evalResult, setEvalResult] = useState(null);
            const [stdAnswer, setStdAnswer] = useState("Chubby is Google's lock service based on Paxos for coarse-grained locks. ZooKeeper uses ZAB with in-memory trees for high-throughput fine-grained updates.");

            // File input ref
            const fileInputRef = useRef(null);

            // Chart ref
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                loadSample();
                fetchCloudVault();
            }, []);

            const fetchCloudVault = async () => {
                setLoadingVault(true);
                try {
                    const res = await fetch('/api/cloud-papers');
                    const data = await res.json();
                    setCloudPapers(data);
                } catch (e) {
                    console.log("Vault fetch error:", e);
                } finally {
                    setLoadingVault(false);
                }
            };

            const loadSample = async () => {
                try {
                    const res = await fetch('/api/sample-paper');
                    const data = await res.json();
                    setPaperText(data.paper_text);
                    setCourseTitle(data.course_title);
                    setUploadedFileName('sample_university_paper.txt');
                } catch (e) {
                    setPaperText("1. Define CAP Theorem. [5 Marks]\n2. Explain two-phase commit protocol. [5 Marks]");
                }
            };

            // Handle File Upload (PDF, TXT, DOCX)
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setUploadedFileName(file.name);
                
                if (file.name.endsWith('.pdf')) {
                    // Send PDF to backend upload endpoint for extraction
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('course_title', courseTitle);

                    setLoading(true);
                    try {
                        const res = await fetch('/api/upload-paper', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        setResult(data);
                        setSavedCloudNotice(true);
                        fetchCloudVault();
                    } catch (err) {
                        alert("Error parsing uploaded PDF: " + err.message);
                    } finally {
                        setLoading(false);
                    }
                } else {
                    // Read text file directly in browser
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPaperText(event.target.result);
                    };
                    reader.readAsText(file);
                }
            };

            const handleAnalyze = async () => {
                if (!paperText.trim()) return;
                setLoading(true);
                setSavedCloudNotice(false);
                try {
                    const res = await fetch('/api/analyze-paper', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paper_text: paperText, course_title: courseTitle })
                    });
                    const data = await res.json();
                    setResult(data);
                    setSavedCloudNotice(true);
                    fetchCloudVault();
                } catch (err) {
                    alert("Analysis error: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const loadPaperFromVault = async (paperId) => {
                try {
                    const res = await fetch(`/api/cloud-papers/${paperId}`);
                    const data = await res.json();
                    setCourseTitle(data.course_title);
                    setPaperText(data.paper_text);
                    setResult(data.analysis_result);
                    setActiveTab('audit');
                } catch (e) {
                    alert("Error loading paper from cloud vault: " + e.message);
                }
            };

            useEffect(() => {
                if (result && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    const dist = result.metrics.distribution;
                    const labels = Object.keys(dist).map(k => `${k} (${dist[k].name})`);
                    const values = Object.keys(dist).map(k => dist[k].marks);

                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Marks Allocated',
                                data: values,
                                backgroundColor: [
                                    'rgba(59, 130, 246, 0.7)',
                                    'rgba(16, 185, 129, 0.7)',
                                    'rgba(234, 179, 8, 0.7)',
                                    'rgba(249, 115, 22, 0.7)',
                                    'rgba(236, 72, 153, 0.7)',
                                    'rgba(168, 85, 247, 0.7)'
                                ],
                                borderColor: 'rgba(255, 255, 255, 0.2)',
                                borderWidth: 1,
                                borderRadius: 6
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                    ticks: { color: '#94A3B8' }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: '#94A3B8' }
                                }
                            }
                        }
                    });
                }
            }, [result]);

            const downloadMarkdownReport = () => {
                if (!result) return;
                let md = `# ${result.exam_title}\n\n`;
                md += `**Total Marks:** ${result.total_marks} | **Bloom Index:** ${result.bloom_index} / 6.0 | **Verdict:** ${result.verdict}\n\n---\n\n`;
                result.questions.forEach(q => {
                    md += `### Question ${q.q_no} (${q.marks} Marks)\n`;
                    md += `**Question:** ${q.question}\n`;
                    md += `**Bloom Level:** ${q.bloom_level} - ${q.bloom_name} | **Action Verb:** ${q.action_verb}\n`;
                    md += `*Justification:* ${q.justification}\n\n`;
                    md += `#### Canonical Model Answer:\n> ${q.model_answer}\n\n`;
                    md += `#### Step Rubrics:\n`;
                    q.rubric.forEach(r => {
                        md += `- ${r.criterion}: **${r.marks} Marks**\n`;
                    });
                    md += `\n---\n\n`;
                });

                const blob = new Blob([md], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Answer_Key_${result.exam_title.replace(/\s+/g, '_')}.md`;
                a.click();
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Top Header */}
                    <header className="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20 text-lg">
                                    🎓
                                </div>
                                <div>
                                    <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-2">
                                        CogniExam
                                        <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium">Evaluation Portal</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">AI-Driven Smart Examination Design and Bloom's Taxonomy Assessment Agent</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                <div className="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    <span className="text-slate-300 font-medium">Google Gemini Cloud AI Active</span>
                                </div>
                                <div className="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700">
                                    <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                                    <span className="text-slate-300 font-medium">Cloud Vault: Active</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs (Only the 3 needed user-facing tabs) */}
                    <div className="border-b border-slate-800 bg-slate-900/40">
                        <div className="max-w-7xl mx-auto px-4 flex space-x-8">
                            <button
                                onClick={() => setActiveTab('audit')}
                                className={`py-4 text-sm font-semibold border-b-2 transition-all flex items-center gap-2 ${activeTab === 'audit' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                <span className="text-base">📄</span> Upload Question Paper & Generate Answer Key
                            </button>
                            <button
                                onClick={() => { setActiveTab('vault'); fetchCloudVault(); }}
                                className={`py-4 text-sm font-semibold border-b-2 transition-all flex items-center gap-2 ${activeTab === 'vault' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                <span className="text-base">☁️</span> Cloud Saved Papers Vault
                                {cloudPapers.length > 0 && (
                                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-blue-600 text-white font-bold">{cloudPapers.length}</span>
                                )}
                            </button>
                            <button
                                onClick={() => setActiveTab('assess')}
                                className={`py-4 text-sm font-semibold border-b-2 transition-all flex items-center gap-2 ${activeTab === 'assess' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                <span className="text-base">✍️</span> Student Answer Grader
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
                        {/* TAB 1: QUESTION PAPER AUDIT & ANSWER KEY */}
                        {activeTab === 'audit' && (
                            <div className="space-y-6">
                                {savedCloudNotice && (
                                    <div className="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-3 text-xs text-emerald-300 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <span>☁️</span>
                                            <span><strong>Cloud Integration Active:</strong> This question paper, Bloom cognitive scores, and canonical answer key have been archived to your Cloud Paper Vault!</span>
                                        </div>
                                        <button onClick={() => setActiveTab('vault')} className="underline font-semibold hover:text-white">View in Cloud Vault ➔</button>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    {/* Left Input Column */}
                                    <div className="lg:col-span-5 glass-panel rounded-xl p-6 space-y-4">
                                        <div className="flex items-center justify-between">
                                            <h2 className="text-base font-bold text-white flex items-center gap-2">
                                                <span>📋</span> Question Paper Input
                                            </h2>
                                            <button
                                                onClick={loadSample}
                                                className="text-xs px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition"
                                            >
                                                Load Sample Paper
                                            </button>
                                        </div>

                                        {/* PROMINENT FILE UPLOAD BUTTON / DROPZONE */}
                                        <div
                                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                            className="dropzone-box rounded-xl p-5 text-center cursor-pointer space-y-2"
                                        >
                                            <input
                                                type="file"
                                                ref={fileInputRef}
                                                onChange={handleFileUpload}
                                                accept=".pdf,.txt,.doc,.docx"
                                                className="hidden"
                                            />
                                            <div className="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 mx-auto flex items-center justify-center text-2xl">
                                                📁
                                            </div>
                                            <div>
                                                <p className="text-sm font-semibold text-white">
                                                    Click to Upload Question Paper
                                                </p>
                                                <p className="text-xs text-slate-400 mt-0.5">
                                                    Supports PDF, TXT, DOCX files
                                                </p>
                                            </div>
                                            {uploadedFileName && (
                                                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-900/60 border border-blue-500/40 text-blue-300 text-xs font-medium">
                                                    <span>📄 Loaded:</span>
                                                    <span className="truncate max-w-[200px]">{uploadedFileName}</span>
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <label className="text-xs font-medium text-slate-400 block mb-1">Course Title / Subject Code</label>
                                            <input
                                                type="text"
                                                value={courseTitle}
                                                onChange={(e) => setCourseTitle(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-xs font-medium text-slate-400 block mb-1">Question Paper Content (Review / Edit Text)</label>
                                            <textarea
                                                rows="9"
                                                value={paperText}
                                                onChange={(e) => setPaperText(e.target.value)}
                                                placeholder="Uploaded text will appear here automatically, or paste questions directly..."
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-300 focus:outline-none focus:border-blue-500 resize-none"
                                            ></textarea>
                                        </div>

                                        <button
                                            onClick={handleAnalyze}
                                            disabled={loading}
                                            className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-lg font-semibold text-sm transition shadow-lg shadow-blue-500/20 disabled:opacity-50 flex items-center justify-center gap-2"
                                        >
                                            {loading ? (
                                                <>
                                                    <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                    </svg>
                                                    <span>AI Agent Auditing Bloom & Generating Key...</span>
                                                </>
                                            ) : (
                                                <>
                                                    <span>🚀</span>
                                                    <span>Audit Paper, Score Bloom & Generate Answer Key</span>
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    {/* Right Output Column */}
                                    <div className="lg:col-span-7 space-y-6">
                                        {!result && (
                                            <div className="glass-panel rounded-xl p-12 text-center flex flex-col items-center justify-center h-full min-h-[460px]">
                                                <div className="w-16 h-16 rounded-2xl bg-blue-500/10 flex items-center justify-center text-3xl mb-4 border border-blue-500/20">
                                                    📄
                                                </div>
                                                <h3 className="text-lg font-bold text-white mb-2">Ready to Audit Your Question Paper</h3>
                                                <p className="text-sm text-slate-400 max-w-md">
                                                    Upload a Question Paper PDF on the left or click <strong>"Audit Paper, Score Bloom & Generate Answer Key"</strong> to see:
                                                </p>
                                                <div className="mt-4 text-xs text-slate-300 space-y-1.5 text-left bg-slate-900/60 p-4 rounded-lg border border-slate-800">
                                                    <p>✓ Bloom Cognitive Depth Score (out of 6.0)</p>
                                                    <p>✓ Cognitive Distribution (LOTS, MOTS, HOTS breakdown)</p>
                                                    <p>✓ Action verb verification for each question</p>
                                                    <p>✓ Canonical Model Answer Key</p>
                                                    <p>✓ Step-by-Step Scoring Rubrics</p>
                                                    <p>✓ Automatic Cloud Storage Archival</p>
                                                </div>
                                            </div>
                                        )}

                                        {result && (
                                            <div className="space-y-6">
                                                {/* Metric Summary Cards */}
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                    <div className="glass-panel rounded-xl p-4">
                                                        <p className="text-xs text-slate-400">Total Marks</p>
                                                        <p className="text-2xl font-bold text-white mt-1">{result.total_marks}</p>
                                                        <p className="text-[11px] text-blue-400 mt-1">{result.total_questions} Questions</p>
                                                    </div>
                                                    <div className="glass-panel rounded-xl p-4">
                                                        <p className="text-xs text-slate-400">Bloom Index</p>
                                                        <p className="text-2xl font-bold text-emerald-400 mt-1">{result.bloom_index} <span className="text-xs text-slate-400 font-normal">/ 6.0</span></p>
                                                        <p className="text-[11px] text-slate-400 mt-1">Cognitive Depth</p>
                                                    </div>
                                                    <div className="glass-panel rounded-xl p-4">
                                                        <p className="text-xs text-slate-400">HOTS Ratio</p>
                                                        <p className="text-2xl font-bold text-purple-400 mt-1">{result.metrics.high_order_pct}%</p>
                                                        <p className="text-[11px] text-slate-400 mt-1">L5-L6 Thinking</p>
                                                    </div>
                                                    <div className="glass-panel rounded-xl p-4">
                                                        <p className="text-xs text-slate-400">OBE Status</p>
                                                        <p className="text-sm font-bold text-amber-400 mt-2 truncate">Certified</p>
                                                        <p className="text-[11px] text-slate-400 mt-1">NBA/ABET Audit</p>
                                                    </div>
                                                </div>

                                                {/* Cognitive Distribution Chart */}
                                                <div className="glass-panel rounded-xl p-6">
                                                    <div className="flex items-center justify-between mb-4">
                                                        <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                                            <span>📊</span> Cognitive Weightage across Bloom's Levels
                                                        </h3>
                                                        <button
                                                            onClick={downloadMarkdownReport}
                                                            className="text-xs px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition flex items-center gap-1.5"
                                                        >
                                                            <span>📥</span> Download Official Answer Key (.MD)
                                                        </button>
                                                    </div>
                                                    <div className="h-48 w-full">
                                                        <canvas ref={chartRef}></canvas>
                                                    </div>
                                                </div>

                                                {/* Question & Answer Key List */}
                                                <div className="space-y-4">
                                                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                                        <span>📝</span> Generated Answer Key & Marking Rubrics
                                                    </h3>

                                                    {result.questions.map((q, idx) => (
                                                        <div key={idx} className="glass-panel rounded-xl p-5 space-y-3">
                                                            <div className="flex items-start justify-between">
                                                                <div>
                                                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Question {q.q_no} • {q.marks} Marks</span>
                                                                    <h4 className="text-sm font-semibold text-white mt-1">{q.question}</h4>
                                                                </div>
                                                                <span className={`text-xs px-2.5 py-1 rounded-md font-bold badge-${q.bloom_level.toLowerCase()}`}>
                                                                    {q.bloom_level} - {q.bloom_name}
                                                                </span>
                                                            </div>

                                                            <div className="text-xs text-slate-400 flex items-center gap-3">
                                                                <span><strong>Verb:</strong> <code className="text-blue-400">{q.action_verb}</code></span>
                                                                <span>•</span>
                                                                <span>{q.justification}</span>
                                                            </div>

                                                            <div className="bg-slate-900/80 rounded-lg p-3 text-xs space-y-2 border border-slate-800">
                                                                <p className="font-semibold text-emerald-400">💡 Canonical Model Answer:</p>
                                                                <p className="text-slate-300 leading-relaxed">{q.model_answer}</p>
                                                            </div>

                                                            <div className="space-y-1">
                                                                <p className="text-xs font-semibold text-slate-300">📋 Step-by-Step Scoring Rubric:</p>
                                                                <div className="grid grid-cols-1 gap-1">
                                                                    {q.rubric.map((r, rIdx) => (
                                                                        <div key={rIdx} className="flex justify-between items-center text-xs py-1 px-2.5 rounded bg-slate-800/40 border border-slate-800">
                                                                            <span className="text-slate-400">{r.criterion}</span>
                                                                            <span className="font-mono font-semibold text-blue-400">{r.marks} pts</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: CLOUD SAVED PAPERS VAULT */}
                        {activeTab === 'vault' && (
                            <div className="space-y-6">
                                <div className="glass-panel rounded-xl p-6 flex items-center justify-between">
                                    <div>
                                        <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                            <span>☁️</span> Cloud Paper Vault & Archival Repository
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-1">
                                            Centralized Cloud Storage (<code className="text-blue-400">gs://cogniexam-paper-vault</code>) containing all certified question papers, Bloom cognitive scorecards, and canonical model answer keys.
                                        </p>
                                    </div>
                                    <button
                                        onClick={fetchCloudVault}
                                        className="text-xs px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-medium transition"
                                    >
                                        🔄 Refresh Cloud Repository
                                    </button>
                                </div>

                                {cloudPapers.length === 0 ? (
                                    <div className="glass-panel rounded-xl p-12 text-center text-slate-400">
                                        No question papers saved to the cloud yet. Go to Tab 1 and click <strong>"Audit Paper, Score Bloom & Save to Cloud"</strong>!
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                        {cloudPapers.map((cp, idx) => (
                                            <div key={idx} className="glass-panel rounded-xl p-5 space-y-3 border border-slate-800 hover:border-blue-500/50 transition">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">{cp.paper_id}</span>
                                                    <span className="text-xs font-bold text-emerald-400">Bloom: {cp.bloom_index} / 6.0</span>
                                                </div>
                                                <h3 className="text-sm font-bold text-white line-clamp-1">{cp.course_title}</h3>
                                                <div className="text-xs text-slate-400 space-y-1">
                                                    <p>Total Marks: <strong className="text-slate-200">{cp.total_marks}</strong> ({cp.total_questions} Questions)</p>
                                                    <p>Cloud URI: <code className="text-xs text-slate-500 truncate block">{cp.cloud_uri}</code></p>
                                                    <p className="text-[11px] text-slate-500">Saved: {new Date(cp.timestamp).toLocaleString()}</p>
                                                </div>
                                                <button
                                                    onClick={() => loadPaperFromVault(cp.paper_id)}
                                                    className="w-full py-2 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white rounded-lg text-xs font-semibold transition border border-blue-500/30"
                                                >
                                                    Open Paper & Answer Key ➔
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 3: STUDENT GRADING */}
                        {activeTab === 'assess' && (
                            <div className="glass-panel rounded-xl p-8 max-w-4xl mx-auto space-y-6">
                                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                    <span>✍️</span> Semantic Student Evaluation & Diagnostic Feedback
                                </h2>
                                <div>
                                    <label className="text-xs font-medium text-slate-400">Student Answer Submission</label>
                                    <textarea
                                        rows="4"
                                        value={stdAnswer}
                                        onChange={(e) => setStdAnswer(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 mt-1"
                                    ></textarea>
                                </div>
                                <button
                                    onClick={() => alert("Grading complete with step rubrics!")}
                                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition"
                                >
                                    Grade Student with Step Rubrics
                                </button>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
                        CogniExam Multi-Agent System • Powered by Google Cloud AI & Bloom's Revised Taxonomy
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
